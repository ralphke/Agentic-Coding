schema: spec-driven

context: |
  This repository is the consumer project and uses this openspec/ directory
  for its own specifications and changes. Shared Software Fabric assets and
  shared-repository OpenSpec work belong to the registered agentic-shared
  store; select it explicitly with --store agentic-shared. The asset sync
  manifest pins the upstream repository and release independently.

rules:
  proposal:
    - Keep consumer-project changes under openspec/changes/<slug>/.
    - Include scope, scenarios, acceptance criteria, and affected domains.
  tasks:
    - Create tasks.md before implementation and keep tasks ordered and testable.
  archive:
    - Archive completed consumer-project changes under openspec/changes/archive/.

