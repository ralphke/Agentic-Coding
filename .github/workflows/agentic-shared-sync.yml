name: Sync Agentic Shared Assets

# Canonical sync workflow, mirrored from ralphke/agentic-shared.
# Consumes shared agent/skill/prompt/instruction/workflow definitions by
# pinned version in .agentic-shared.yml. Always proposes changes as a pull
# request for repo-owner review; the default branch is never modified
# directly by this workflow. To pick up upstream changes, run this workflow
# manually with the desired tagged release (see releases at
# https://github.com/ralphke/agentic-shared/releases).

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: Tagged agentic-shared release to install, for example v1.1.0. Leave blank to install the latest release.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Synchronize shared assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@v7
        with:
          path: consumer
          fetch-depth: 1

      - name: Normalize target version
        id: version
        env:
          RAW_VERSION: ${{ inputs.target_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RAW_VERSION}"
          if [[ -z "${version}" ]]; then
            # Try GitHub Releases first; fall back to the latest git tag.
            version="$(gh release list --repo ralphke/agentic-shared --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)"
            if [[ -z "${version}" ]]; then
              version="$(gh api repos/ralphke/agentic-shared/tags --paginate --jq '.[].name' 2>/dev/null | sort -V | tail -n1 || true)"
            fi
            if [[ -z "${version}" ]]; then
              echo "No version specified and no releases or tags found in ralphke/agentic-shared."
              echo "Please provide a target_version or publish a release/tag in the upstream repository."
              exit 1
            fi
            echo "No version specified; resolved latest: ${version}"
          fi
          [[ "${version}" == v* ]] || version="v${version}"
          echo "target_version=${version}" >> "$GITHUB_OUTPUT"

      - name: Read consumer manifest
        id: manifest
        working-directory: consumer
        env:
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          manifest_path = Path('.agentic-shared.yml')
          with manifest_path.open(encoding='utf-8') as manifest_file:
              manifest = yaml.safe_load(manifest_file)
          source = manifest['source']
          print(f"source repository: {source['repository']}")
          print(f"installed version: {source['version']}")
          print(f"target version: {os.environ['TARGET_VERSION']}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"repository={source['repository']}\n")
              output.write(f"old_version={source['version']}\n")
          PY

      - name: Checkout installed shared release
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.manifest.outputs.repository }}
          ref: ${{ steps.manifest.outputs.old_version }}
          path: shared-old
          fetch-depth: 1

      - name: Checkout target shared release
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.manifest.outputs.repository }}
          ref: ${{ steps.version.outputs.target_version }}
          path: shared-new
          fetch-depth: 1

      - name: Validate and synchronize assets
        run: |
          python -m pip install --disable-pip-version-check --quiet PyYAML
          python shared-new/.github/scripts/validate_agentic_shared_manifest.py consumer/.agentic-shared.yml
          PYTHONPATH=shared-new/.github/scripts python shared-new/.github/scripts/sync_agentic_shared.py \
            --manifest consumer/.agentic-shared.yml \
            --old-source shared-old \
            --new-source shared-new \
            --destination consumer \
            --target-version '${{ steps.version.outputs.target_version }}'

      - name: Open synchronization pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: consumer
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/agentic-shared-${{ steps.version.outputs.target_version }}
          delete-branch: true
          commit-message: "chore: sync agentic-shared ${{ steps.version.outputs.target_version }}"
          title: "chore: sync agentic-shared ${{ steps.version.outputs.target_version }}"
          body: |
            Updates shared agentic assets to `${{ steps.version.outputs.target_version }}`.

            The sync validator ran with three-way conflict detection against
            [`ralphke/agentic-shared`](https://github.com/ralphke/agentic-shared).
            Review the generated diff and run consumer CI before merging.
          labels: |
            dependencies
            agentic-shared-sync
