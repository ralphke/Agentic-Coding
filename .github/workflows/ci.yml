name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  workshop-structure-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required workshop files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "doc/workshop-roadmap.md"
            "doc/setup.md"
            "doc/environments.md"
            "lab/01-beginner/01-copilot-foundations.md"
            "lab/02-intermediate/01-tests-and-refactor.md"
            "lab/03-advanced/01-agentic-cicd.md"
            "lab/01-beginner/01-copilot-foundations.md"
            "lab/02-intermediate/01-tests-and-refactor.md"
            "lab/03-advanced/01-agentic-cicd.md"
            ".github/ISSUE_TEMPLATE/copilot-task.yml"
            ".devcontainer/devcontainer.json"
            ".devcontainer/post-create.sh"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

      - name: Ensure prompts are sequentially named
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d ".github/prompts" ]]; then
            echo "Missing .github/prompts directory"
            exit 1
          fi

          ls .github/prompts | grep -Eq '^[0-9]{2}-.*\.md$' || {
            echo "No ordered prompt files found in .github/prompts"
            exit 1
          }

      - name: Validate devcontainer configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating devcontainer.json is valid JSON..."
          python3 -c "import json,sys; json.load(open('.devcontainer/devcontainer.json'))" \
            && echo "✓ devcontainer.json is valid JSON"

          echo "Checking post-create.sh has a shebang..."
          head -1 .devcontainer/post-create.sh | grep -q '^#!' \
            && echo "✓ post-create.sh has shebang"

      - name: Markdown lint style sanity check
        shell: bash
        run: |
          set -euo pipefail
          find . -name "*.md" -type f | while read -r f; do
            if grep -q $'\t' "$f"; then
              echo "Tab character found in markdown file: $f"
              exit 1
            fi
          done
