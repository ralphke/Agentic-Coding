name: DevContainer Security Scan

on:
  push:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build devcontainer image
        uses: docker/build-push-action@v5
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          tags: |
            agentic-workshop:latest
            agentic-workshop:${{ github.sha }}
          load: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
      
      - name: Run Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          image: agentic-workshop:latest
          format: sarif
          output: scout-results.sarif
          summary: true
      
      - name: Upload Scout results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: scout-results.sarif
          category: docker-scout-devcontainer
      
      - name: Fail on HIGH/CRITICAL CVEs
        run: |
          docker scout cves agentic-workshop:latest --format json | \
            jq 'if (.vulnerabilities[]? | select(.severity == "critical" or .severity == "high")) then 
              "\(.severity): \(.title)" | debug else empty end' && \
            CRITICAL_COUNT=$(docker scout cves agentic-workshop:latest --format json | \
              jq '[.vulnerabilities[]? | select(.severity == "critical" or .severity == "high")] | length') && \
            if [ "$CRITICAL_COUNT" -gt 0 ]; then 
              echo "❌ Found $CRITICAL_COUNT HIGH/CRITICAL CVEs - build failed"; 
              exit 1; 
            else 
              echo "✅ No HIGH/CRITICAL CVEs found"; 
            fi

  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build image for Trivy
        run: |
          docker build -t agentic-workshop:trivy .devcontainer
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agentic-workshop:trivy
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-devcontainer
