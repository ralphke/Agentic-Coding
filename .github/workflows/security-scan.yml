name: DevContainer Security Scan

on:
  push:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/security-scan.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/security-scan.yml'
  schedule:
    # Monthly cadence (1st day of each month)
    - cron: '23 2 1 * *'
  workflow_dispatch:

jobs:
  trivy-image-fast:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.54.1
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Build devcontainer image via Compose
        id: resolve_image
        run: |
          docker compose -f .devcontainer/docker-compose.yml build agentic-coding
          IMAGE_NAME=$(docker compose -f .devcontainer/docker-compose.yml config | awk '/image:/ {print $2; exit}')
          if [ -z "$IMAGE_NAME" ]; then
            echo "Could not resolve image name from .devcontainer/docker-compose.yml"
            exit 1
          fi
          docker image inspect "$IMAGE_NAME" >/dev/null
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Trivy image SARIF (fast)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --format sarif --output /work/trivy-image-fast.sarif --exit-code 0 --no-progress "${{ steps.resolve_image.outputs.image_name }}"

      - name: Enforce HIGH/CRITICAL gate (image)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --exit-code 1 --no-progress "${{ steps.resolve_image.outputs.image_name }}"

      - name: Upload Trivy image results
        if: always() && hashFiles('trivy-image-fast.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-fast.sarif
          category: trivy-devcontainer-image

      - name: Add fast scan summary
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --format json "${{ steps.resolve_image.outputs.image_name }}" > trivy-image-fast.json

          HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-image-fast.json)
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-image-fast.json)

          {
            echo "## DevContainer Security Summary (Fast)"
            echo ""
            echo "| Scan | High | Critical |"
            echo "|---|---:|---:|"
            echo "| Image (${{ steps.resolve_image.outputs.image_name }}) | ${HIGH_COUNT} | ${CRITICAL_COUNT} |"
          } >> "$GITHUB_STEP_SUMMARY"

  trivy-deep-weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.54.1
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Build devcontainer image via Compose
        id: resolve_image
        run: |
          docker compose -f .devcontainer/docker-compose.yml build agentic-coding
          IMAGE_NAME=$(docker compose -f .devcontainer/docker-compose.yml config | awk '/image:/ {print $2; exit}')
          if [ -z "$IMAGE_NAME" ]; then
            echo "Could not resolve image name from .devcontainer/docker-compose.yml"
            exit 1
          fi
          docker image inspect "$IMAGE_NAME" >/dev/null
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Trivy deep image SARIF (report)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --format sarif --output /work/trivy-deep-image.sarif --exit-code 0 --no-progress "${{ steps.resolve_image.outputs.image_name }}"

      - name: Upload deep image results
        if: always() && hashFiles('trivy-deep-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-deep-image.sarif
          category: trivy-devcontainer-deep-image

      - name: Generate Trivy deep filesystem SARIF (repo)
        run: |
          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE" \
            fs --severity HIGH,CRITICAL --scanners vuln,config --format sarif --output /repo/trivy-deep-fs.sarif --exit-code 0 --no-progress /repo

      - name: Upload deep filesystem results
        if: always() && hashFiles('trivy-deep-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-deep-fs.sarif
          category: trivy-devcontainer-deep-fs

      - name: Add deep scan summary
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/repo" "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --format json "${{ steps.resolve_image.outputs.image_name }}" > trivy-deep-image.json

          docker run --rm -v "$PWD:/repo" "$TRIVY_IMAGE" \
            fs --severity HIGH,CRITICAL --format json /repo > trivy-deep-fs.json

          IMG_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-deep-image.json)
          IMG_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-deep-image.json)
          FS_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-deep-fs.json)
          FS_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-deep-fs.json)

          {
            echo "## DevContainer Security Summary (Deep)"
            echo ""
            echo "| Scan | High | Critical |"
            echo "|---|---:|---:|"
            echo "| Image (${{ steps.resolve_image.outputs.image_name }}) | ${IMG_HIGH} | ${IMG_CRITICAL} |"
            echo "| Filesystem (repo) | ${FS_HIGH} | ${FS_CRITICAL} |"
          } >> "$GITHUB_STEP_SUMMARY"
