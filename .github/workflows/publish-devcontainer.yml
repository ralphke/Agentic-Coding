name: Publish DevContainer Image

"on":
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DEVCONTAINER_IMAGE_NAME: agentic-coding-devcontainer

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Resolve GHCR image reference
        id: image_ref
        run: |
          GHCR_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "devcontainer_image=ghcr.io/${GHCR_OWNER}/${DEVCONTAINER_IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build devcontainer image 
        run: |
          docker build -f .devcontainer/Dockerfile \
          -t "${{ steps.image_ref.outputs.devcontainer_image }}:latest" \
          -t "${{ steps.image_ref.outputs.devcontainer_image }}:${{ github.sha }}" \
          .

      - name: Push to GHCR
        run: |
          docker push "${{ steps.image_ref.outputs.devcontainer_image }}:latest"
          docker push "${{ steps.image_ref.outputs.devcontainer_image }}:${{ github.sha }}"

      - name: Add publish summary
        run: |
          {
            echo "## DevContainer Image Published"
            echo ""
            echo "| Tag | Value |"
            echo "|---|---|"
            echo "| latest | \`${{ steps.image_ref.outputs.devcontainer_image }}:latest\` |"
            echo "| sha | \`${{ steps.image_ref.outputs.devcontainer_image }}:${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
