name: Sync agentic-shared

on:
  workflow_dispatch:
  schedule:
    - cron: "11 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync shared Software Fabric assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.AGENTIC_DEVOPS_TOKEN }}
          fetch-depth: 0

      - name: Clone agentic-shared
        env:
          AGENTIC_SHARED_TOKEN: ${{ secrets.AGENTIC_SHARED_TOKEN }}
        run: |
          set -euo pipefail
          AUTH=""
          [[ -n "$AGENTIC_SHARED_TOKEN" ]] && AUTH="x-access-token:${AGENTIC_SHARED_TOKEN}@"
          git clone --depth=1 "https://${AUTH}github.com/ralphke/agentic-shared.git" /tmp/agentic-shared

      - name: Configure git for GitHub Actions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync shared manifest assets with merge-aware logic
        run: |
          set -euo pipefail
          python3 scripts/sync_agentic_shared.py

      - name: Stage sync changes
        run: |
          set -euo pipefail
          git add -A
          git status --short

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "detected=false" >> "$GITHUB_OUTPUT"
            echo "No changes — repos are already in sync."
          else
            echo "detected=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected — will open a sync PR."
            git diff --stat
          fi

      - name: Create sync pull request
        if: steps.changes.outputs.detected == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AGENTIC_DEVOPS_TOKEN }}
          branch: sync/agentic-shared
          delete-branch: true
          commit-message: "sync: update shared Software Fabric assets from agentic-shared"
          title: "sync: update shared Software Fabric assets from agentic-shared"
          body: |
            Sync canonical shared assets from [`ralphke/agentic-shared`](https://github.com/ralphke/agentic-shared).

            Files synced are listed in [`manifests/agentic-coding.txt`](https://github.com/ralphke/agentic-shared/blob/main/manifests/agentic-coding.txt) in the upstream repo.

            Workshop-specific labs, docs, and environment files remain local to this repository.
