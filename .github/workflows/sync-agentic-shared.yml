name: Sync agentic-shared

on:
  workflow_dispatch:
  schedule:
    - cron: "11 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync shared Software Fabric assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Agentic-Coding
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout agentic-shared
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          repository: ralphke/agentic-shared
          path: .tmp/agentic-shared

      # The manifest in agentic-shared is the single source of truth for which
      # files are synced into this repo. No changes to this workflow are needed
      # when files are added or removed upstream — update the manifest instead.
      - name: Copy files listed in manifest
        run: |
          MANIFEST=".tmp/agentic-shared/manifests/agentic-coding.txt"

          if [[ ! -f "$MANIFEST" ]]; then
            echo "::error::Manifest not found: $MANIFEST"
            exit 1
          fi

          while IFS= read -r file || [[ -n "$file" ]]; do
            [[ -z "$file" || "$file" =~ ^# ]] && continue

            src=".tmp/agentic-shared/${file}"
            dst="${file}"

            if [[ ! -e "$src" ]]; then
              echo "::warning::Not found in agentic-shared: $file"
              continue
            fi

            mkdir -p "$(dirname "$dst")"
            cp -R "$src" "$dst"
            echo "  ✅ $file"
          done < "$MANIFEST"

      - name: Create sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync/agentic-shared
          delete-branch: true
          commit-message: "sync: update shared Software Fabric assets from agentic-shared"
          title: "sync: update shared Software Fabric assets from agentic-shared"
          body: |
            Sync canonical shared assets from [`ralphke/agentic-shared`](https://github.com/ralphke/agentic-shared).

            Files synced are listed in [`manifests/agentic-coding.txt`](https://github.com/ralphke/agentic-shared/blob/main/manifests/agentic-coding.txt) in the upstream repo — no workflow changes are needed when the manifest changes.

            Workshop-specific labs, docs, and environment files remain local to this repository.
