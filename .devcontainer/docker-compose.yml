# Optional manual build path. VS Code uses devcontainer.json as the source of truth.
# This compose file is only needed for manual Docker builds, not for normal container reopen.
# It uses the same base image as devcontainer.json and the single manual Dockerfile: Dockerfile.security-fix.
# If devcontainer.json changes its base image, keep Dockerfile.security-fix aligned.
# invoked by: docker compose -f docker-compose.yml build 2>&1 | tail -50
services:
  agentic-coding:
    container_name: Agentic-Coding-latest
    #    image: ghcr.io/ralphke/agentic-coding-image@sha256:25a699a1f866a77aa00e5a16f0bb098ecd4425dabe6be21881a9ca8de788d73d
    image: ghcr.io/ralphke/agentic-coding-image:latest
    build:
      context: .
      dockerfile: ${DOCKERFILE_TARGET:-Dockerfile}
    command: /bin/bash
    environment:
      PATH: /usr/local/python/current/bin:/usr/local/py-utils/bin:/usr/local/jupyter:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/share/dotnet
      DOTNET_ROOT: /usr/share/dotnet
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      PYTHON_PATH: /usr/local/python/current
      PIPX_HOME: /usr/local/py-utils
      PIPX_BIN_DIR: /usr/local/py-utils/bin
    stdin_open: true
    tty: true
