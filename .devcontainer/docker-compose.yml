# invoked by: docker compose -f docker-compose.yml build 2>&1 | tail -50
services:
  agentic-coding:
    container_name: Agentic-Coding-latest
    image: vsc-agentic-coding-90b20fc2c7ebd922c7765dca321d4b38f103999d96731b1f783a1facbd615b2e-features:latest-fixed
    build:
      context: .
      dockerfile: ${DOCKERFILE_TARGET:-Dockerfile.security-fix}
    command: /bin/bash
    environment:
      PATH: /usr/local/python/current/bin:/usr/local/py-utils/bin:/usr/local/jupyter:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/share/dotnet
      DOTNET_ROOT: /usr/share/dotnet
      DOTNET_RUNNING_IN_CONTAINER: "true"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      PYTHON_PATH: /usr/local/python/current
      PIPX_HOME: /usr/local/py-utils
      PIPX_BIN_DIR: /usr/local/py-utils/bin
    stdin_open: true
    tty: true
